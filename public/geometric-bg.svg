  <rect x="1000" y="0" width="333.33" height="300" fill="#312e81" />

  <!-- Top Row Elements -->
  <circle cx="166.66" cy="150" r="100" fill="#9333ea" />
  
  <polygon points="480,80 500,100 480,120 460,100" fill="#f59e0b" />
  <polygon points="520,80 540,100 520,120 500,100" fill="#fbbf24" />
  <rect x="380" y="180" width="240" height="10" fill="#06b6d4" />
